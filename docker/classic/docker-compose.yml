# Classic event-driven stack: PostgreSQL 18 + Redis 8 + Kafka 4 (KRaft).
# Start: docker compose -f docker/classic/docker-compose.yml up -d --build --wait
#
# Each service has 1 dedicated CPU core (cpuset), like a small production instance.
# netproxy uses cores 5-8; the load generator uses cores 9-11.
# All service-to-service traffic goes through "netproxy", which adds network
# latency (NET_DELAY_US one way, default 500 us = 1 ms round trip, a typical
# AWS cross-AZ value). The load generator calls the API directly: the client hop
# is the same for every stack.
name: eda-classic

services:
  netproxy:
    image: eda-bench-app:latest
    build: ../../app
    command: ["netproxy"]
    environment:
      NET_DELAY_US: "${NET_DELAY_US:-500}"
      ROUTES: "5432=postgres:5432,6379=redis:6379,9092=kafka:9092"
      GOGC: "400"   # fewer GC cycles: the proxy allocates one buffer per chunk
    cpuset: "${NETPROXY_CPUSET:-5-8}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 1g }

  postgres:
    image: postgres:18.7
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=200
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - synchronous_commit=on
      - -c
      - io_method=worker
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpuset: "${PG_CPUSET:-0}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 2g }

  redis:
    image: redis:8.10.3
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "768mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpuset: "${REDIS_CPUSET:-1}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 1g }

  kafka:
    image: apache/kafka:4.4.0
    depends_on: [netproxy]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://netproxy:9092   # clients connect through the latency proxy
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 60
    cpuset: "${KAFKA_CPUSET:-2}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 2g }

  api:
    image: eda-bench-app:latest
    build: ../../app
    command: ["api"]
    environment:
      MODE: classic
      PG_DSN: postgres://bench:bench@netproxy:5432/bench
      PG_POOL: "${API_PG_POOL:-96}"   # sized for 1 ms network RTT
      REDIS_ADDR: netproxy:6379
      KAFKA_BROKERS: netproxy:9092
    ports: ["8080:8080"]
    depends_on:
      netproxy: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/stats"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpuset: "${API_CPUSET:-3}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 512m }

  worker:
    image: eda-bench-app:latest
    build: ../../app
    command: ["worker"]
    environment:
      MODE: classic
      PG_DSN: postgres://bench:bench@netproxy:5432/bench
      KAFKA_BROKERS: netproxy:9092
      WORKER_CONCURRENCY: 4
      BATCH_SIZE: 500
      KAFKA_FETCH_MAX_WAIT_MS: "${KAFKA_FETCH_MAX_WAIT_MS:-10}"
    ports: ["8081:8081"]
    depends_on:
      netproxy: { condition: service_started }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/stats"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpuset: "${WORKER_CPUSET:-4}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 512m }
