# Modern event-driven stack: PostgreSQL 18 only (outbox + SKIP LOCKED queue).
# Start: docker compose -f docker/modern/docker-compose.yml up -d --build --wait
#
# Each service has 1 dedicated CPU core (cpuset), like a small production instance.
# netproxy uses cores 5-8; the load generator uses cores 9-11.
# PG_CPUSET / PG_MEM change the PostgreSQL size. PG_CPUSET=0-2 PG_MEM=5g gives
# PostgreSQL the same budget as the classic infrastructure
# (PostgreSQL 1 + Redis 1 + Kafka 1 = 3 CPUs; 2 + 1 + 2 = 5 GB).
# PG_NOTIFY=true switches consumer wake-up from polling to LISTEN/NOTIFY.
#
# All service-to-service traffic goes through "netproxy", which adds network
# latency (NET_DELAY_US one way, default 500 us = 1 ms round trip, a typical
# AWS cross-AZ value). The load generator calls the API directly: the client hop
# is the same for every stack.
name: eda-modern

services:
  netproxy:
    image: eda-bench-app:latest
    build: ../../app
    command: ["netproxy"]
    environment:
      NET_DELAY_US: "${NET_DELAY_US:-500}"
      ROUTES: "5432=postgres:5432"
      GOGC: "400"   # fewer GC cycles: the proxy allocates one buffer per chunk
    cpuset: "${NETPROXY_CPUSET:-5-8}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 1g }

  postgres:
    image: postgres:18.7
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=200
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - synchronous_commit=on
      - -c
      - io_method=worker   # PG18 asynchronous I/O subsystem (default value, set explicitly)
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpuset: "${PG_CPUSET:-0}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: "${PG_MEM:-2g}" }

  api:
    image: eda-bench-app:latest
    build: ../../app
    command: ["api"]
    environment:
      MODE: modern
      PG_DSN: postgres://bench:bench@netproxy:5432/bench
      PG_POOL: "${API_PG_POOL:-96}"   # sized for 1 ms network RTT
    ports: ["8080:8080"]
    depends_on:
      netproxy: { condition: service_started }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/stats"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpuset: "${API_CPUSET:-3}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 512m }

  worker:
    image: eda-bench-app:latest
    build: ../../app
    command: ["worker"]
    environment:
      MODE: modern
      PG_DSN: postgres://bench:bench@netproxy:5432/bench
      WORKER_CONCURRENCY: 4
      BATCH_SIZE: 500
      PG_NOTIFY: "${PG_NOTIFY:-false}"        # true = LISTEN/NOTIFY wake-up (see RESULT.md)
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-10}"
    ports: ["8081:8081"]
    depends_on:
      netproxy: { condition: service_started }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/stats"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpuset: "${WORKER_CPUSET:-4}"   # dedicated core(s), no CFS throttling
    deploy:
      resources:
        limits: { memory: 512m }
